# External collection schema (documentation only; no collection is registered):
# Each [datasets.NAME] entry must record kind = "artifact", artifact (the
# collection binding in dev/Artifacts.toml), path (relative instance path),
# sha256 (the instance SHA-256), source_url, version, provenance, license,
# expected_status, expected_objective (when a finite optimum exists), and tags.
# Optional exceptions may explain instance-specific deviations or limitations.
# Record concrete verified metadata before adding a collection. Private data
