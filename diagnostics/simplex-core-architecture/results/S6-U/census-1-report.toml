observed_source = """@testset \"A repeated price disagreement cannot renew the recovery budget\" begin\n    for manager in (:pfi,:forrest_tomlin,:suhl_suhl,:bartels_golub)\n        events=Dict[]\n        diagnostics=JSimplex.SimplexDiagnostics(;kernel_timing=true,observer=(event,ws)->begin\n            push!(events,Dict(\"event\"=>string(event),\"boundary\"=>\"before_original_callback\",\"state\"=>snapshot(ws)))\n            # Fault injection after publication forces a second disagreement.\n            event==:primal_prices_corrected && (ws.reduced_costs[7]=-1.0)\n            event==:primal_prices_corrected && push!(events,Dict(\"event\"=>string(event),\"boundary\"=>\"after_original_callback\",\"state\"=>snapshot(ws)))\n        end)\n        ws=native_price_roundoff_fixture(Float64,manager;diagnostics)\n        before=snapshot(ws)\n        initial_counts=copy(diagnostics.counts)\n        initial_kernels=copy(diagnostics.kernel_calls)\n        initial_event_count=length(events)\n        result=JSimplex._primal_iteration!(ws,()->false,0.0)\n        push!(RECORDS,Dict(\"manager\"=>string(manager),\"before\"=>before,\"after\"=>snapshot(ws),\"events\"=>events,\"initial_event_count\"=>initial_event_count,\"options\"=>fields(ws.options),\"policy\"=>fields(ws.progress.numerical_policy),\"A_rows\"=>[collect(ws.problem.A[i,:]) for i in axes(ws.problem.A,1)],\"status\"=>isnothing(result) ? \"nothing\" : string(result.status),\"result_type\"=>string(typeof(result)),\"message\"=>isnothing(result) ? \"nothing\" : result.message,\"counts\"=>Dict(string(k)=>v for (k,v) in diagnostics.counts),\"iteration_counts\"=>Dict(string(k)=>v-initial_counts[k] for (k,v) in diagnostics.counts),\"iteration_kernels\"=>Dict(string(k)=>v-initial_kernels[k] for (k,v) in diagnostics.kernel_calls)))\n        @test !isnothing(result) && result.status==NUMERICAL_ERROR\n        @test JSimplex.event_count(diagnostics,:primal_prices_corrected)==1\n        @test JSimplex.event_count(diagnostics,:correction_attempt)==1\n        @test ws.iterations==0\n        @test isempty(ws.scratch.rejected_entering)\n    end\nend\n"""
arch = "aarch64"
julia_threads = 1
original_source = """@testset \"A repeated price disagreement cannot renew the recovery budget\" begin\n    for manager in (:pfi,:forrest_tomlin,:suhl_suhl,:bartels_golub)\n        diagnostics=JSimplex.SimplexDiagnostics(;observer=(event,ws)->begin\n            # Fault injection after publication forces a second disagreement.\n            event==:primal_prices_corrected && (ws.reduced_costs[7]=-1.0)\n        end)\n        ws=native_price_roundoff_fixture(Float64,manager;diagnostics)\n        result=JSimplex._primal_iteration!(ws,()->false,0.0)\n        @test !isnothing(result) && result.status==NUMERICAL_ERROR\n        @test JSimplex.event_count(diagnostics,:primal_prices_corrected)==1\n        @test JSimplex.event_count(diagnostics,:correction_attempt)==1\n        @test ws.iterations==0\n        @test isempty(ws.scratch.rejected_entering)\n    end\nend\n"""
blas_threads = 1
helper_source = """function native_price_roundoff_fixture(T,manager;genuine=false,max_refinements=3,diagnostics=nothing)\n    B=T[-3 2 2 1 -3 0; 4 -2 -2 -1 3 0; 1 3 10 0 3 -3;\n        -1 0 0 6 -2 1; 2 -3 -2 0 8 -1; -1 -3 1 3 2 4]\n    unit=Matrix{T}(I,6,6)[:,3:6]\n    A=sparse(hcat(B,unit,-unit,zeros(T,6)))\n    costs=vcat(one(T),zeros(T,13),genuine ? -T(1e-30) : zero(T))\n    rhs=B*ones(T,6)\n    upper=vcat(fill(Bound{T}(nothing),14),Bound(one(T)))\n    p=LinearProblem(A,costs;row_lower=rhs,row_upper=rhs,column_upper=upper)\n    options=SolverOptions(T;algorithm=:primal,basis_update=manager,verbose=false)\n    policy=JSimplex.NumericalPolicy(T;max_refinements)\n    ws=JSimplex.initialize_workspace(p,options;\n        progress=JSimplex.SimplexProgressContext(p;numerical_policy=policy,diagnostics))\n    ws.basis=JSimplex.Basis(collect(1:6),vcat(fill(JSimplex.BASIC,6),fill(JSimplex.AT_LOWER,15)))\n    JSimplex.recompute!(ws;refactorize=true)\n    ws.primal.=vcat(ones(T,6),zeros(T,9),rhs)\n    return ws\nend\n"""

