text = "function force_pricing_trial!(ws,algorithm)\n    JSimplex._prepare_auto_pricing!(ws,algorithm)\n    state = ws.scratch.pricing\n    state.return_mode = state.active\n    state.active = :dantzig\n    state.temporary = true\n    state.trial_until = 8\n    return state\nend\n"
